<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quản Trị Hệ Thống - TechShop{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; border-radius: 6px; margin: 4px 8px; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #0d6efd; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Admin -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3 text-white">
            <h4 class="fw-bold text-primary mb-4 text-center">TechShop Admin</h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="{{ url_for('admin.dashboard') }}" class="active">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard Thống Kê
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('admin.manage_products') }}">
                        <i class="bi bi-box-seam me-2"></i> Quản Lý Sản Phẩm
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('admin.manage_orders') }}">
                        <i class="bi bi-receipt me-2"></i> Quản Lý Đơn Hàng
                    </a>
                </li>
                <hr class="text-secondary my-3">
                <li class="nav-item">
                    <a href="{{ url_for('main.index') }}" class="text-info">
                        <i class="bi bi-arrow-left-circle me-2"></i> Về Website
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Admin Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
