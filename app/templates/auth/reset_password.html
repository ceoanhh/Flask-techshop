{% extends "base.html" %}
{% block title %}Đặt Lại Mật Khẩu - TechShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-1 text-primary fw-bold">Đặt Lại Mật Khẩu</h3>
                <p class="text-center text-muted small mb-4">
                    Mã xác thực OTP đã được gửi đến: <strong class="text-dark">{{ target }}</strong>
                </p>

                <!-- Khối thông báo lỗi khi nhập sai OTP (alert-permanent để không bị JS tự động đóng) -->
                <div id="resetErrorAlert" class="alert alert-danger alert-permanent py-2 px-3 small d-none mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i><span id="resetErrorMessage"></span>
                </div>

                <form id="resetPasswordForm" action="{{ url_for('auth.reset_password') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mã xác thực OTP <span class="text-danger">*</span></label>
                        <input type="text" 
                               name="otp" 
                               id="otpInput" 
                               class="form-control text-center fs-4 fw-bold letter-spacing" 
                               placeholder="Nhập 6 số OTP" 
                               maxlength="6" 
                               required 
                               autofocus>
                        <div id="otpFeedback" class="invalid-feedback text-center fw-semibold"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                        <input type="password" name="new_password" id="newPasswordInput" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                        <input type="password" name="confirm_password" id="confirmPasswordInput" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
                    </div>

                    <button type="submit" id="btnSubmitReset" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">
                        <i class="bi bi-check-circle-fill me-1"></i>Xác Nhận Đổi Mật Khẩu
                    </button>
                </form>

                <div class="text-center d-flex justify-content-between align-items-center pt-3 border-top">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none small text-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại nhập SĐT/Email
                    </a>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="btnResendResetOtp">
                        <i class="bi bi-arrow-repeat me-1"></i>Gửi lại mã OTP
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('resetPasswordForm');
    const submitBtn = document.getElementById('btnSubmitReset');
    const btnResend = document.getElementById('btnResendResetOtp');
    const otpInput = document.getElementById('otpInput');
    const errorAlert = document.getElementById('resetErrorAlert');
    const errorMessage = document.getElementById('resetErrorMessage');
    const otpFeedback = document.getElementById('otpFeedback');

    // Xóa lỗi khi người dùng bắt đầu gõ lại mã OTP
    otpInput.addEventListener('input', function () {
        otpInput.classList.remove('is-invalid');
        errorAlert.classList.add('d-none');
    });

    // 1. Quản lý bộ đếm ngược 60 giây gửi lại mã OTP
    let countdown = {{ cooldown_seconds|default(60) }};
    let timer = null;

    function startCountdown(seconds) {
        countdown = seconds;
        if (timer) clearInterval(timer);

        if (countdown > 0) {
            btnResend.disabled = true;
            btnResend.innerHTML = `Gửi lại (${countdown}s)`;
            timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btnResend.disabled = false;
                    btnResend.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Gửi lại mã OTP';
                } else {
                    btnResend.innerHTML = `Gửi lại (${countdown}s)`;
                }
            }, 1000);
        } else {
            btnResend.disabled = false;
            btnResend.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Gửi lại mã OTP';
        }
    }

    startCountdown(countdown);

    // 2. Submit form bằng AJAX để khi nhập sai trang KHÔNG bị load lại (bộ đếm tiếp tục chạy liên tục)
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorAlert.classList.add('d-none');

        const newPass = document.getElementById('newPasswordInput').value;
        const confirmPass = document.getElementById('confirmPasswordInput').value;

        if (newPass.length < 6) {
            errorMessage.textContent = 'Mật khẩu mới phải chứa ít nhất 6 ký tự!';
            errorAlert.classList.remove('d-none');
            return;
        }

        if (newPass !== confirmPass) {
            errorMessage.textContent = 'Mật khẩu xác nhận không trùng khớp!';
            errorAlert.classList.remove('d-none');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Đang xác thực...';

        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json'
            }
        })
        .then(res => res.json().then(data => ({ ok: res.ok, data: data })))
        .then(result => {
            const data = result.data;
            if (result.ok && data.success) {
                // Đổi mật khẩu thành công -> chuyển về trang đăng nhập
                window.location.href = data.redirect_url;
            } else {
                // Hiển thị lỗi ngay trên trang (bộ đếm thời gian 60s vẫn đang chạy không hề bị gián đoạn)
                const msg = data.message || 'Mã OTP không chính xác!';
                errorMessage.textContent = msg;
                errorAlert.classList.remove('d-none');

                // Đánh dấu lỗi đỏ trực tiếp trên ô nhập OTP
                otpInput.classList.add('is-invalid');
                if (otpFeedback) otpFeedback.textContent = msg;

                // Đồng thời bật Toast đỏ nổi bật ở góc màn hình
                if (window.showToast) {
                    window.showToast(msg, 'danger');
                }

                otpInput.value = '';
                otpInput.focus();

                if (data.otp_invalidated) {
                    // Nếu nhập sai 5 lần: mã OTP bị hủy, khóa nút submit đến khi nhận mã mới
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="bi bi-x-circle me-1"></i>Mã OTP Đã Bị Hủy';
                    btnResend.classList.remove('btn-outline-primary');
                    btnResend.classList.add('btn-primary', 'shadow');
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Xác Nhận Đổi Mật Khẩu';
                }
            }
        })
        .catch(err => {
            console.error('Lỗi khi đổi mật khẩu:', err);
            errorMessage.textContent = 'Đã có lỗi mạng xảy ra. Vui lòng thử lại!';
            errorAlert.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Xác Nhận Đổi Mật Khẩu';
        });
    });

    // 3. Xử lý nút Gửi lại mã OTP
    btnResend.addEventListener('click', function () {
        btnResend.disabled = true;
        btnResend.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Đang gửi...';

        fetch("{{ url_for('auth.resend_reset_otp') }}", {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json'
            }
        })
        .then(res => res.json().then(data => ({ ok: res.ok, data: data })))
        .then(result => {
            const data = result.data;
            if (result.ok && data.success) {
                errorAlert.classList.add('d-none');
                otpInput.classList.remove('is-invalid');
                otpInput.value = '';
                otpInput.focus();

                // Khôi phục nút submit nếu trước đó bị khóa do nhập sai 5 lần
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Xác Nhận Đổi Mật Khẩu';
                btnResend.classList.remove('btn-primary', 'shadow');
                btnResend.classList.add('btn-outline-primary');

                // Bắt đầu đếm ngược 60 giây mới
                startCountdown(data.cooldown_seconds || 60);
            } else {
                errorMessage.textContent = data.message || 'Không thể gửi lại mã OTP!';
                errorAlert.classList.remove('d-none');
                btnResend.disabled = false;
                btnResend.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Gửi lại mã OTP';
            }
        })
        .catch(err => {
            console.error('Lỗi gửi lại OTP:', err);
            errorMessage.textContent = 'Không thể kết nối máy chủ để gửi lại mã!';
            errorAlert.classList.remove('d-none');
            btnResend.disabled = false;
            btnResend.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Gửi lại mã OTP';
        });
    });
});
</script>
{% endblock %}
