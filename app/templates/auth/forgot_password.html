{% extends "base.html" %}
{% block title %}Quên Mật Khẩu - TechShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-1 text-primary fw-bold">Khôi Phục Mật Khẩu</h3>
                <p class="text-center text-muted small mb-4">
                    Nhập <strong>Số điện thoại</strong> hoặc <strong>Email</strong> đã đăng ký tài khoản
                </p>

                <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Số điện thoại hoặc Email <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted">
                                <i class="bi bi-person-badge"></i>
                            </span>
                            <input type="text" 
                                   name="identifier" 
                                   class="form-control" 
                                   placeholder="Ví dụ: 0912345678 hoặc user@gmail.com" 
                                   required 
                                   autofocus>
                        </div>
                        <div class="form-text">Hệ thống sẽ kiểm tra tài khoản và gửi mã OTP xác nhận về máy của bạn.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
                        Tiếp Tục & Gửi Mã OTP <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3 pt-2 border-top">
                    <small class="text-muted">Nhớ mật khẩu rồi? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Đăng nhập</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
