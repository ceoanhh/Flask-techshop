{% extends "base.html" %}
{% block title %}Đăng Ký Tài Khoản - TechShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-1 text-primary fw-bold">Tạo Tài Khoản</h3>
                <p class="text-center text-muted small mb-4">Mã OTP sẽ tự động được gửi khi bạn bấm Đăng ký</p>

                <form action="{{ url_for('auth.register', next=request.args.get('next')) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên người dùng (Username) <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" placeholder="Nhập username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email liên hệ <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                        <input type="tel" name="phone" class="form-control" placeholder="Ví dụ: 0912345678 (10 số)" required>
                        <div class="form-text">Số điện thoại chính chủ để nhận mã OTP kích hoạt tài khoản.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2 shadow-sm">
                        Đăng Ký Tài Khoản <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3 pt-2 border-top">
                    <small class="text-muted">Đã có tài khoản? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}" class="text-decoration-none fw-semibold">Đăng nhập ngay</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
