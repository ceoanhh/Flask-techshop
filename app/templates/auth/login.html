{% extends "base.html" %}
{% block title %}Đăng Nhập - TechShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-1 text-primary fw-bold">Đăng Nhập</h3>
                <p class="text-center text-muted small mb-4">Truy cập để quản lý đơn hàng và ưu đãi</p>

                <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
                    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email hoặc Số điện thoại</label>
                        <input type="text" name="login_id" class="form-control" placeholder="Email hoặc SĐT đăng ký" required autofocus>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label fw-semibold mb-0">Mật khẩu</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none small text-primary">Quên mật khẩu?</a>
                        </div>
                        <input type="password" name="password" class="form-control mt-1" placeholder="Nhập mật khẩu" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
                    </button>
                </form>

                <div class="text-center mt-3 pt-2 border-top">
                    <small class="text-muted">Chưa có tài khoản? <a href="{{ url_for('auth.register', next=request.args.get('next')) }}" class="text-decoration-none fw-semibold">Đăng ký ngay</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
