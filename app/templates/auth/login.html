{% extends 'base.html' %}

{% block title %}Đăng Nhập - TechShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4 text-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Đăng Nhập
                </h3>
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email hoặc Tên đăng nhập</label>
                        <input type="text" name="email" class="form-control" required placeholder="admin hoặc user@techshop.vn">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Đăng Nhập</button>
                    </div>
                </form>
                <div class="text-center mt-3 text-muted">
                    Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
