{% extends "base.html" %}
{% block title %}Đăng Nhập{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">Đăng Nhập</h3>
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Đăng Nhập</button>
                </form>
                <div class="text-center mt-3">
                    <small>Chưa có tài khoản? <a href="{{ url_for('auth.register') }}" class="text-decoration-none">Đăng ký ngay</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
